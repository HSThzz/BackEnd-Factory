name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          echo "Building project..."
          npm run build
          echo "Build completed. Checking output..."

      - name: Check build output
        run: |
          echo "Checking build output..."
          echo "Dist directory contents:"
          ls -la dist/ || echo "dist directory not found"
          echo ""
          echo "Dist/bin directory contents:"
          ls -la dist/bin/ || echo "dist/bin directory not found"
          echo ""
          echo "Dist/src directory contents:"
          ls -la dist/src/ || echo "dist/src directory not found"
          echo ""
          test -f dist/bin/create-backend-api.js && echo "✅ dist/bin/create-backend-api.js exists" || (echo "❌ dist/bin/create-backend-api.js not found" && find dist -name "*.js" | head -10 && exit 1)
          test -f dist/src/index.js && echo "✅ dist/src/index.js exists" || (echo "❌ dist/src/index.js not found" && exit 1)
